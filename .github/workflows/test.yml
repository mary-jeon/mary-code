name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      # Without this, one fast-failing leg cancels the others and the
      # remaining platforms are never actually verified.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/gate.test.js
      - run: node tests/stats.test.js
